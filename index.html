<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlushBreak • Team AFK Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', system-ui, sans-serif; background: linear-gradient(135deg, #fdf2f8 0%, #fae8e8 100%); }
        .glass { background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); }
        .active-card { animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(236,72,153,0.4); } 70% { box-shadow: 0 0 0 25px rgba(236,72,153,0); }}
        .clickable { transition: all 0.15s ease; }
        .clickable:active { transform: scale(0.92); }
    </style>
</head>
<body class="min-h-screen pb-12">
    <div class="max-w-6xl mx-auto px-6 pt-8">
        <div class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-4">
                <div class="w-14 h-14 bg-gradient-to-br from-pink-500 to-pink-600 rounded-3xl flex items-center justify-center shadow-lg">
                    <i class="fa-solid fa-coffee text-white text-3xl"></i>
                </div>
                <h1 class="text-4xl font-bold text-pink-600">BlushBreak</h1>
            </div>
            <p class="text-pink-400 font-medium">Shared Across Devices</p>
        </div>

        <!-- Join + Manage -->
        <div class="glass rounded-3xl p-6 mb-8 border border-pink-100">
            <div class="flex gap-3 mb-6">
                <input id="user-name" type="text" placeholder="Enter your name" 
                       class="flex-1 px-6 py-4 rounded-2xl border border-pink-200 focus:border-pink-400 text-lg">
                <button onclick="addUser()" class="px-10 bg-pink-600 hover:bg-pink-700 text-white font-semibold rounded-2xl">Join Team</button>
            </div>

            <div class="pt-4 border-t border-pink-100">
                <h4 class="text-pink-600 font-medium mb-3">Manage Team</h4>
                <div class="flex gap-3">
                    <button onclick="clearHistory()" 
                            class="flex-1 bg-orange-500 hover:bg-orange-600 text-white py-3 rounded-2xl font-medium">
                        🗑️ Clear All Logs
                    </button>
                    <button onclick="showUserManagement()" 
                            class="flex-1 bg-gray-600 hover:bg-gray-700 text-white py-3 rounded-2xl font-medium">
                        👥 Manage Users
                    </button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-7">
                <div class="glass rounded-3xl p-8 border border-pink-100">
                    <h3 class="text-2xl font-semibold text-pink-700 mb-6">Start a Break</h3>
                    <select id="user-select" class="w-full px-6 py-4 rounded-2xl border border-pink-200 mb-6 text-lg"></select>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4" id="break-options"></div>
                    <button onclick="startBreak()" class="mt-8 w-full bg-gradient-to-r from-pink-500 to-pink-600 text-white py-6 rounded-2xl font-semibold text-xl shadow-lg">🚀 START BREAK</button>
                </div>
            </div>

            <div class="lg:col-span-5">
                <div class="glass rounded-3xl p-6 border border-pink-100 h-full">
                    <h3 class="font-semibold text-xl text-pink-700 mb-5 flex items-center gap-2">
                        <span class="text-red-500">●</span> Currently Away
                    </h3>
                    <div id="live-breaks" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <div class="mt-10 glass rounded-3xl p-8 border border-pink-100">
            <h3 class="font-semibold text-xl text-pink-700 mb-6">Recent Activity</h3>
            <div id="history-list" class="space-y-3"></div>
        </div>
    </div>

    <!-- User Management Modal -->
    <div id="user-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="glass rounded-3xl p-8 max-w-md w-full mx-4">
            <h3 class="text-2xl font-semibold text-pink-700 mb-6">Manage Users</h3>
            <div id="user-list" class="max-h-96 overflow-auto space-y-2"></div>
            <button onclick="closeModal()" class="mt-6 w-full py-3 bg-gray-200 hover:bg-gray-300 rounded-2xl font-medium">Close</button>
        </div>
    </div>

    <script>
        const BIN_ID = "6a1fbf3ef5f4af5e29b0aaef";
        const MASTER_KEY = "$2a$10$rpKZV1xmoBH3ajAK0fpQ9uKGSk6sK5bhZq9Mr4MZv4bmpl/QbhJ9S";

        const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;
        const breakTypes = [
            { name: "Lunch", icon: "🍱" }, { name: "Bathroom", icon: "🚽" },
            { name: "Cigar", icon: "🚬" }, { name: "Bio Break", icon: "🌿" },
            { name: "Water", icon: "💧" }, { name: "Coffee", icon: "☕" },
            { name: "Bio Sleep", icon: "😴" }, { name: "Huddle", icon: "👥" }
        ];

        let selectedBreakType = null;
        let localData = { users: [], active: [], history: [] };

        async function loadData() {
            try {
                const res = await fetch(`${API_URL}/latest`, { headers: { "X-Master-Key": MASTER_KEY } });
                const json = await res.json();
                localData = json.record || { users: [], active: [], history: [] };
            } catch(e) {}
        }

        async function saveData() {
            try {
                await fetch(API_URL, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json", "X-Master-Key": MASTER_KEY },
                    body: JSON.stringify(localData)
                });
            } catch(e) {}
        }

        async function addUser() {
            const name = document.getElementById("user-name").value.trim();
            if (!name) return alert("Please enter a name");
            if (!localData.users.includes(name)) localData.users.push(name);
            await saveData();
            document.getElementById("user-name").value = "";
            loadUsers();
        }

        function renderBreakOptions() {
            const container = document.getElementById("break-options");
            container.innerHTML = "";
            breakTypes.forEach(bt => {
                const div = document.createElement("div");
                div.className = "clickable p-5 rounded-2xl border-2 border-transparent hover:border-pink-400 text-center cursor-pointer transition-all hover:-translate-y-1";
                div.innerHTML = `<div class="text-5xl mb-2">${bt.icon}</div><div class="font-medium">${bt.name}</div>`;
                div.onclick = () => {
                    selectedBreakType = bt;
                    document.querySelectorAll('#break-options > div').forEach(d => d.style.borderColor = '');
                    div.style.borderColor = '#db2777';
                };
                container.appendChild(div);
            });
        }

        async function startBreak() {
            const user = document.getElementById("user-select").value;
            if (!user) return alert("Please select your name");
            if (!selectedBreakType) return alert("Please choose a break type");

            localData.active = localData.active.filter(b => b.user !== user);
            localData.active.push({ user, type: selectedBreakType, startTime: Date.now() });
            
            refreshUI();
            await saveData();
            selectedBreakType = null;
        }

        async function endBreak(user) {
            const brIndex = localData.active.findIndex(b => b.user === user);
            if (brIndex === -1) return;

            const br = localData.active[brIndex];
            const duration = Math.round((Date.now() - br.startTime) / 60000);

            localData.history.unshift({ user, type: br.type, duration, time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) });
            localData.active.splice(brIndex, 1);

            refreshUI();
            await saveData();
        }

        async function loadUsers() {
            await loadData();
            const select = document.getElementById("user-select");
            select.innerHTML = '<option value="">— Select Your Name —</option>';
            localData.users.forEach(u => {
                const opt = document.createElement("option");
                opt.value = u; opt.textContent = u;
                select.appendChild(opt);
            });
        }

        function refreshUI() {
            // Live Breaks with MM:SS
            const liveDiv = document.getElementById("live-breaks");
            liveDiv.innerHTML = localData.active.length ? "" : `<p class="text-pink-300 text-center py-12">Everyone is working 💕</p>`;

            localData.active.forEach(br => {
                const elapsed = Date.now() - br.startTime;
                const min = Math.floor(elapsed / 60000);
                const sec = Math.floor((elapsed % 60000) / 1000);

                const card = document.createElement("div");
                card.className = "active-card bg-white rounded-2xl p-5 border border-pink-100";
                card.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div class="flex items-center gap-4">
                            <span class="text-4xl">${br.type.icon}</span>
                            <div>
                                <p class="font-semibold text-lg">${br.user}</p>
                                <p class="text-pink-500">${br.type.name}</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-mono text-4xl font-bold text-pink-600 tabular-nums" id="timer-${br.user}">
                                ${min}:${sec.toString().padStart(2, '0')}
                            </p>
                            <button onclick="endBreak('${br.user}')" class="mt-4 px-7 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-sm font-medium">✅ RETURN</button>
                        </div>
                    </div>
                `;
                liveDiv.appendChild(card);
            });

            // History
            const histDiv = document.getElementById("history-list");
            histDiv.innerHTML = "";
            localData.history.slice(0, 20).forEach(h => {
                const div = document.createElement("div");
                div.className = "flex justify-between items-center bg-white p-5 rounded-2xl border border-pink-100";
                div.innerHTML = `
                    <div class="flex items-center gap-4">
                        <span class="text-3xl">${h.type.icon}</span>
                        <div>
                            <p class="font-medium">${h.user}</p>
                            <p class="text-sm text-pink-400">${h.type.name} • ${h.time}</p>
                        </div>
                    </div>
                    <div class="font-bold text-pink-600">${h.duration} min</div>
                `;
                histDiv.appendChild(div);
            });
        }

        // Live timer
        setInterval(() => {
            document.querySelectorAll('[id^="timer-"]').forEach(el => {
                const user = el.id.replace('timer-', '');
                const br = localData.active.find(b => b.user === user);
                if (br) {
                    const elapsed = Date.now() - br.startTime;
                    const min = Math.floor(elapsed / 60000);
                    const sec = Math.floor((elapsed % 60000) / 1000);
                    el.textContent = `${min}:${sec.toString().padStart(2, '0')}`;
                }
            });
        }, 1000);

        setInterval(() => loadData().then(refreshUI), 10000);

        // ==================== NEW FEATURES ====================

        function showUserManagement() {
            const modal = document.getElementById("user-modal");
            const list = document.getElementById("user-list");
            list.innerHTML = "";

            if (localData.users.length === 0) {
                list.innerHTML = `<p class="text-pink-300 py-8 text-center">No users yet</p>`;
            } else {
                localData.users.forEach(user => {
                    const div = document.createElement("div");
                    div.className = "flex justify-between items-center bg-white p-4 rounded-2xl border border-pink-100";
                    div.innerHTML = `
                        <span class="font-medium">${user}</span>
                        <button onclick="deleteUser('${user}')" class="text-red-500 hover:text-red-600 px-4 py-1 rounded-xl hover:bg-red-50">
                            Delete
                        </button>
                    `;
                    list.appendChild(div);
                });
            }
            modal.classList.remove("hidden");
        }

        async function deleteUser(user) {
            if (!confirm(`Delete ${user} from team?`)) return;
            
            localData.users = localData.users.filter(u => u !== user);
            localData.active = localData.active.filter(b => b.user !== user);
            await saveData();
            closeModal();
            loadUsers();
            refreshUI();
        }

        function closeModal() {
            document.getElementById("user-modal").classList.add("hidden");
        }

        async function clearHistory() {
            if (!confirm("Clear ALL history logs? This cannot be undone.")) return;
            localData.history = [];
            await saveData();
            refreshUI();
            alert("History cleared successfully");
        }

        window.onload = () => {
            renderBreakOptions();
            loadUsers();
            refreshUI();
        };
    </script>
</body>
</html>
